<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../public/style/login.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../public/images/logo.png">
<title>Libero – Acceso</title>
</head>
<body>

<!-- HEADER: sesión activa -->
<header class="session-header" id="sessionHeader">
  <button class="session-back" onclick="volverLogin(event)">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Volver al inicio de sesión
  </button>
  <div class="session-info">
    <span class="chip-live">EN VIVO</span>
    <span class="session-user" id="sessionEmail">usuario@email.com</span>
  </div>
</header>

<!-- Flecha salir al sitio -->
<a href="index.html" class="exit-arrow" id="exitArrow" title="Ir al inicio">
  <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
    <path d="M11 4L6 9L11 14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</a>

<!-- ESCENARIO -->
<main class="stage">
  <div class="card" id="card">

    <!-- ═══ LADO IZQUIERDO: formularios ═══ -->
    <div class="forms-side">

      <!-- LOGIN -->
      <section class="pane" id="loginPane">
        <div class="pane-brand">
          <span class="brand-name">Libero Cobre</span>
        </div>
        <h1 class="pane-title">Bienvenido</h1>
        <p class="pane-sub">Inicia sesión en tu cuenta para continuar</p>

        <form class="form" action="/login" method="POST" id="loginForm">
          <div class="field">
            <label for="lEmail">Correo electrónico</label>
            <input id="lEmail" type="email" name="correo" placeholder="correoejemplo@gmail.com" required autocomplete="email">
          </div>
          <div class="field">
            <label for="lPass">Contraseña</label>
            <input id="lPass" type="password" name="password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-main">Ingresar</button>
        </form>

        <p class="switch-text">
          ¿No tienes cuenta?
          <button class="btn-link" onclick="mostrarRegistro()">Regístrate aquí</button>
        </p>
      </section>

      <!-- REGISTRO -->
      <section class="pane pane-reg" id="registerPane" style="display:none">
        <button class="back-pane" onclick="mostrarLogin()">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M9.5 3L4.5 7.5L9.5 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Volver
        </button>
        <h1 class="pane-title" style="margin-top:10px">Crear cuenta</h1>
        <p class="pane-sub">Únete a Libero y empieza hoy mismo</p>

        <form class="form" action="/register" method="POST">
          <div class="field">
            <label>Nombre completo</label>
            <input type="text" name="nombre" placeholder="Tu nombre completo" required>
          </div>
          <div class="field">
            <label>Correo electrónico</label>
            <input type="email" name="correo" placeholder="correoejemplo@gmail.com" required>
          </div>
          <div class="field">
            <label>Contraseña</label>
            <input type="password" name="password" placeholder="••••••••" required>
          </div>
          <div class="field">
            <label>Confirmar contraseña</label>
            <input type="password" name="password2" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-main">Crear cuenta</button>
        </form>

        <p class="switch-text">
          ¿Ya tienes cuenta?
          <button class="btn-link" onclick="mostrarLogin()">Inicia sesión</button>
        </p>
      </section>

    </div>

    <!-- ═══ LADO DERECHO: panel de acento ═══ -->
    <div class="accent-side">
      <div class="accent-inner">

        <!-- burbujas decorativas -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <!-- ilustración SVG -->
        <svg class="illo" viewBox="0 0 260 290" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- laptop base -->
          <rect x="60" y="220" width="140" height="9" rx="4.5" fill="rgba(255,255,255,0.22)"/>
          <!-- pantalla -->
          <rect x="68" y="148" width="124" height="76" rx="11" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.32)" stroke-width="1.5"/>
          <rect x="75" y="155" width="110" height="62" rx="7" fill="rgba(255,255,255,0.09)"/>
          <!-- líneas código -->
          <rect x="84" y="165" width="52" height="5" rx="2.5" fill="rgba(255,255,255,0.55)"/>
          <rect x="84" y="176" width="36" height="5" rx="2.5" fill="rgba(255,255,255,0.38)"/>
          <rect x="84" y="187" width="62" height="5" rx="2.5" fill="rgba(255,255,255,0.52)"/>
          <rect x="84" y="198" width="42" height="5" rx="2.5" fill="rgba(255,255,255,0.32)"/>
          <!-- cursor -->
          <rect x="148" y="165" width="3" height="9" rx="1.5" fill="rgba(255,225,80,0.9)">
            <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
          </rect>
          <!-- cuerpo -->
          <ellipse cx="130" cy="213" rx="23" ry="19" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2"/>
          <!-- cabeza -->
          <circle cx="130" cy="177" r="21" fill="rgba(255,255,255,0.26)" stroke="rgba(255,255,255,0.32)" stroke-width="1.5"/>
          <!-- pelo -->
          <path d="M111 174 Q114 156 130 153 Q146 156 149 174 Q141 166 130 164 Q119 166 111 174Z" fill="rgba(255,255,255,0.52)"/>
          <!-- ojos -->
          <circle cx="123" cy="177" r="2.3" fill="rgba(255,255,255,0.85)"/>
          <circle cx="137" cy="177" r="2.3" fill="rgba(255,255,255,0.85)"/>
          <!-- sonrisa -->
          <path d="M123 183.5 Q130 188 137 183.5" stroke="rgba(255,255,255,0.75)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <!-- brazos -->
          <path d="M109 210 Q88 219 86 236" stroke="rgba(255,255,255,0.28)" stroke-width="7" stroke-linecap="round"/>
          <path d="M151 210 Q172 219 174 236" stroke="rgba(255,255,255,0.28)" stroke-width="7" stroke-linecap="round"/>
          <!-- badge flotante izq -->
          <g>
            <rect x="34" y="126" width="32" height="32" rx="9" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>
            <path d="M43 142 L48 147 L57 137" stroke="rgba(255,225,80,0.95)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="3s" repeatCount="indefinite"/>
          </g>
          <!-- badge flotante der -->
          <g>
            <rect x="196" y="150" width="32" height="32" rx="9" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>
            <circle cx="212" cy="166" r="6" fill="none" stroke="rgba(255,210,80,0.9)" stroke-width="2"/>
            <animateTransform attributeName="transform" type="translate" values="0,0;0,6;0,0" dur="2.8s" repeatCount="indefinite"/>
          </g>
          <!-- puntos decorativos -->
          <circle cx="58" cy="100" r="5" fill="rgba(255,255,255,0.2)">
            <animate attributeName="cy" values="100;94;100" dur="4s" repeatCount="indefinite"/>
          </circle>
          <circle cx="204" cy="120" r="4" fill="rgba(255,255,255,0.18)">
            <animate attributeName="cy" values="120;126;120" dur="3.4s" repeatCount="indefinite"/>
          </circle>
          <rect x="186" y="92" width="12" height="12" rx="3" fill="rgba(255,255,255,0.16)">
            <animate attributeName="y" values="92;86;92" dur="3.8s" repeatCount="indefinite"/>
          </rect>
        </svg>

        <!-- texto del panel derecho -->
        <div class="accent-copy" id="accentCopy">
          <h2 id="accentTitle">Gestiona tu carrera profesional</h2>
          <p id="accentDesc">Postúlate a oportunidades, sigue tus procesos y encuentra tu próximo gran paso.</p>
        </div>

      </div>
    </div>

  </div>
</main>

<script>
function mostrarRegistro() {
  const lp = document.getElementById('loginPane');
  const rp = document.getElementById('registerPane');
  lp.classList.add('pane-exit');
  setTimeout(() => {
    lp.style.display = 'none';
    lp.classList.remove('pane-exit');
    rp.style.display = 'flex';
    rp.classList.add('pane-enter');
    setTimeout(() => rp.classList.remove('pane-enter'), 350);
  }, 180);
  document.getElementById('accentTitle').textContent = 'Únete a Libero';
  document.getElementById('accentDesc').textContent  = 'Crea tu cuenta en segundos y empieza a postularte hoy mismo.';
  document.getElementById('card').classList.add('card-tall');
}

function mostrarLogin() {
  const lp = document.getElementById('loginPane');
  const rp = document.getElementById('registerPane');
  rp.classList.add('pane-exit');
  setTimeout(() => {
    rp.style.display = 'none';
    rp.classList.remove('pane-exit');
    lp.style.display = 'flex';
    lp.classList.add('pane-enter');
    setTimeout(() => lp.classList.remove('pane-enter'), 350);
  }, 180);
  document.getElementById('accentTitle').textContent = 'Gestiona tu carrera profesional';
  document.getElementById('accentDesc').textContent  = 'Postúlate a oportunidades, sigue tus procesos y encuentra tu próximo gran paso.';
  document.getElementById('card').classList.remove('card-tall');
}

function volverLogin(e) {
  e.preventDefault();
  document.getElementById('sessionHeader').classList.remove('active');
  document.getElementById('exitArrow').style.display = '';
}

document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault(); // quitar en producción
  const email = document.getElementById('lEmail').value;
  document.getElementById('sessionEmail').textContent = email || 'usuario@email.com';
  document.getElementById('sessionHeader').classList.add('active');
  document.getElementById('exitArrow').style.display = 'none';
});
</script>

</body>
</html>
