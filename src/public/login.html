<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../public/style/login.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/png" href="../public/images/logo.png">
<title>Login</title>
</head>
<body>

<!-- ESTE LOGIN ES SOLO PARA EJEMPLO, SERIA MEJOR CAMBIARLO O NO SE -->

<a href="index.html" class="back-arrow">←</a>

<div class="auth-wrapper">

  <!-- CAJA LOGIN -->
  <div class="login-box" id="loginBox">
    <h4 class="text-center mb-4">INICIAR SESIÓN</h4>
    <form action="/login" method="POST">
      <div class="mb-3">
        <label class="form-label">CORREO</label>
        <input type="email" class="form-control" name="correo" placeholder="correoejemplo@gmail.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">CONTRASEÑA</label>
        <input type="password" class="form-control" name="password" placeholder="P@sswordExampl3" required>
      </div>
      <button type="submit" class="btn-principal w-100">INGRESAR</button>
    </form>
    <div class="divider">¿No tienes cuenta?</div>
    <button class="btn-registro w-100" onclick="abrirRegistro()">REGISTRARSE</button>
  </div>

  <!-- PANEL REGISTRO (aparece a la derecha) -->
  <div class="register-box" id="registerBox">
    <button class="close-btn" onclick="cerrarRegistro()">✕</button>
    <h4 class="text-center mb-4">CREAR CUENTA</h4>
    <form action="/register" method="POST">
      <div class="mb-3">
        <label class="form-label">NOMBRE COMPLETO</label>
        <input type="text" class="form-control" name="nombre" placeholder="Tu nombre" required>
      </div>
      <div class="mb-3">
        <label class="form-label">CORREO</label>
        <input type="email" class="form-control" name="correo" placeholder="correoejemplo@gmail.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">CONTRASEÑA</label>
        <input type="password" class="form-control" name="password" placeholder="P@sswordExampl3" required>
      </div>
      <div class="mb-3">
        <label class="form-label">CONFIRMAR CONTRASEÑA</label>
        <input type="password" class="form-control" name="password2" placeholder="Repite tu contraseña" required>
      </div>
      <button type="submit" class="btn-principal w-100">CREAR CUENTA</button>
    </form>
  </div>

</div>

<script>
  function abrirRegistro() {
    document.getElementById('registerBox').classList.add('visible');
    document.getElementById('loginBox').classList.add('shifted');
  }
  function cerrarRegistro() {
    document.getElementById('registerBox').classList.remove('visible');
    document.getElementById('loginBox').classList.remove('shifted');
  }
</script>

</body>
</html>
